<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMPN 2 Muting - Sistem Informasi Manajemen Sekolah</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('smpn2muting_theme');
          var isDark = saved === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
